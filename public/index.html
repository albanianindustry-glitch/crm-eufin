<!DOCTYPE html>
<html lang="sq">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CRM – Studio Kontabiliteti</title>
<link rel="icon" href="data:,">
<script src="/shim.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#eef1f5;font-family:'Segoe UI',Arial,sans-serif;color:#1f2937;font-size:14px}
.topbar{height:56px;display:flex;align-items:center;padding:0 20px;background:#1f2a44;color:#fff}
.topbar h1{font-size:1.1em;margin:0;font-weight:600}
nav{display:flex;gap:2px;flex-wrap:wrap;background:#fff;border-bottom:1px solid #d9dee7;padding:0 14px}
nav button{border:0;background:none;padding:13px 16px;font:inherit;color:#4b5563;cursor:pointer;border-bottom:3px solid transparent}
nav button.on{color:#1f2a44;border-bottom-color:#1f2a44;font-weight:600}
nav .sp{flex:1}
main{padding:20px;max-width:1300px;margin:0 auto}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.toolbar h2{margin:0 12px 0 0;font-size:1.2em;color:#1f2a44}
.toolbar input,.toolbar select,.form-group input,.form-group select,.form-group textarea{padding:8px 10px;border:1px solid #cfd5df;border-radius:5px;font:inherit;background:#fff;width:100%}
.toolbar input,.toolbar select{width:auto}
.btn{padding:8px 14px;border:0;border-radius:5px;font:inherit;cursor:pointer}
.btn-primary{background:#1f2a44;color:#fff}
.btn-secondary{background:#e5e9f0;color:#1f2a44}
.btn-danger{background:#b4443b;color:#fff}
.btn-small{padding:4px 9px;font-size:.88em}
.table-section{background:#fff;border:1px solid #d9dee7;border-radius:8px;overflow-x:auto}
table{width:100%;min-width:640px;border-collapse:collapse}
th,td{padding:9px 12px;text-align:left;border-bottom:1px solid #eef1f5;vertical-align:top}
th{background:#f6f8fb;font-size:.82em;text-transform:uppercase;letter-spacing:.03em;color:#6b7280;white-space:nowrap}
tr:last-child td{border-bottom:0}
td.act{white-space:nowrap;text-align:right}
td.empty{text-align:center;color:#6b7280;padding:28px}
a{color:#1f2a44}
.badge{display:inline-block;padding:2px 9px;border-radius:10px;font-size:.85em;background:#e5e9f0;color:#1f2a44;white-space:nowrap}
.badge.good{background:#dcf1e3;color:#1d6b3a}.badge.warn{background:#fdf0d5;color:#8a5a0a}.badge.bad{background:#f8dedb;color:#9b2f27}.badge.info{background:#dce8fa;color:#1f4f9b}
.late{color:#b4443b;font-weight:600}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:18px}
.card{background:#fff;border:1px solid #d9dee7;border-radius:8px;padding:16px;cursor:pointer}
.card b{display:block;font-size:1.9em;color:#1f2a44}.card span{color:#6b7280}
.panels{display:grid;grid-template-columns:repeat(auto-fit,minmax(380px,1fr));gap:14px}
.panel{background:#fff;border:1px solid #d9dee7;border-radius:8px;padding:14px 16px}
.panel h3{margin:0 0 8px;font-size:1em;color:#1f2a44}
.panel .it{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-top:1px solid #eef1f5;cursor:pointer}
.panel .it:hover{background:#f6f8fb}.panel .none{color:#6b7280;padding:6px 0}
.modal{display:none;position:fixed;inset:0;background:rgba(15,23,42,.5);z-index:2600;overflow:auto}
.modal.active{display:block}
.modal-content{background:#fff;margin:40px auto;max-width:780px;width:94%;padding:22px;border-radius:8px}
.modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.modal-header h3{margin:0;color:#1f2a44}
.close-modal{border:0;background:none;font-size:1.8em;line-height:1;cursor:pointer;color:#6b7280}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form-group label{display:block;font-size:.85em;margin-bottom:4px;color:#4b5563}
.form-group.full,.form-grid h4{grid-column:1/-1}
.form-grid h4{margin:10px 0 0;color:#1f2a44;border-bottom:1px solid #e5e9f0;padding-bottom:4px}
.form-grid .note{grid-column:1/-1;color:#6b7280;font-size:.88em}
.pw{display:flex;gap:6px}
.foot{display:flex;gap:8px;justify-content:flex-end;margin-top:18px}
.kv{display:grid;grid-template-columns:170px 1fr;gap:4px 12px;margin-bottom:14px}.kv dt{color:#6b7280}.kv dd{margin:0}
.sub{margin:14px 0 6px;font-weight:600;color:#1f2a44;display:flex;justify-content:space-between;align-items:center}
@media(max-width:700px){.topbar{height:96px;align-items:flex-end;padding-bottom:10px}.form-grid{grid-template-columns:1fr}main{padding:12px}.panels{grid-template-columns:1fr}.kv{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="topbar"><h1>Studio Kontabiliteti – CRM</h1></div>
<nav id="tabs"></nav>
<main id="main"></main>
<div class="modal" id="fm"><div class="modal-content"><div class="modal-header"><h3 id="fmT"></h3><button class="close-modal" data-act="closeForm" type="button">×</button></div><form id="fmF" autocomplete="off"><div class="form-grid" id="fmB"></div><div class="foot"><button type="button" class="btn btn-secondary" data-act="closeForm">Anulo</button><button class="btn btn-primary">Ruaj</button></div></form></div></div>
<div class="modal" id="dm"><div class="modal-content"><div class="modal-header"><h3 id="dmT"></h3><button class="close-modal" data-act="closeDetail" type="button">×</button></div><div id="dmB"></div></div></div>

<script>
(function () {
  'use strict';
  var ME = window.CRM_ME;
  if (!ME) return; // shim po ridrejton te hyrja ose ka dështuar
  var ADMIN = ME.role === 'admin';
  var MAXPDF = 3000000;

  function load(k, d) { try { var v = JSON.parse(localStorage.getItem(k)); return v == null ? d : v; } catch (e) { return d; } }
  var S = { clients: load('crmClients', []), apps: load('crmAplikime', []), changes: load('crmNdryshime', []), vat: load('crmDeklarimeTVSH', []), x: load('crmX', {}) };
  if (!Array.isArray(S.clients)) S.clients = [];
  ['apps', 'changes', 'vat'].forEach(function (k) { if (!Array.isArray(S[k])) S[k] = []; });
  if (!S.x || typeof S.x !== 'object') S.x = {};
  S.x.users = S.x.users || []; S.x.detyra = S.x.detyra || [];
  S.tasks = S.x.detyra;
  var KEY = { clients: 'crmClients', apps: 'crmAplikime', changes: 'crmNdryshime', vat: 'crmDeklarimeTVSH' };
  function save(ent) {
    if (ent === 'tasks') localStorage.setItem('crmX', JSON.stringify(S.x));
    else localStorage.setItem(KEY[ent], JSON.stringify(S[ent]));
  }

  /* ---------- ndihmëse ---------- */
  function $(id) { return document.getElementById(id); }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
  function p2(n) { return (n < 10 ? '0' : '') + n; }
  function ymd(d) { return d.getFullYear() + '-' + p2(d.getMonth() + 1) + '-' + p2(d.getDate()); }
  var TODAY = ymd(new Date());
  function addDays(n) { var d = new Date(); d.setDate(d.getDate() + n); return ymd(d); }
  function fd(v) { var m = /^(\d{4})-(\d{2})-(\d{2})/.exec(v || ''); return m ? m[3] + '.' + m[2] + '.' + m[1] : (v || ''); }
  var MON = ['Janar', 'Shkurt', 'Mars', 'Prill', 'Maj', 'Qershor', 'Korrik', 'Gusht', 'Shtator', 'Tetor', 'Nëntor', 'Dhjetor'];
  function fm(v) { var m = /^(\d{4})-(\d{2})$/.exec(v || ''); return m ? MON[+m[2] - 1] + ' ' + m[1] : (v || ''); }
  function money(n) { n = parseFloat(n); return isNaN(n) ? '' : n.toLocaleString('en-GB', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
  function clientById(id) { return S.clients.filter(function (c) { return c.id === id; })[0]; }
  function cn(id) { var c = clientById(id); return c ? c.emri : (id ? '(klient i fshirë)' : ''); }
  function vatDue(per) { var m = /^(\d{4})-(\d{2})$/.exec(per || ''); if (!m) return ''; var y = +m[1], mo = +m[2] + 1; if (mo > 12) { mo = 1; y++; } return y + '-' + p2(mo) + '-14'; }
  function vatDiff(r) { return (parseFloat(r.tvshShitje) || 0) - (parseFloat(r.tvshBlerje) || 0); }
  function users() { var a = (S.x.users || []).slice(); if (a.indexOf(ME.name) < 0) a.push(ME.name); return a.sort(); }
  function find(ent, id) { return S[ent].filter(function (r) { return r.id === id; })[0]; }
  var BADGE = { 'Përfunduar': 'good', 'E kryer': 'good', 'Paguar': 'good', 'Aktiv': 'good', 'Deklaruar': 'info', 'Në process': 'warn', 'Në punë': 'warn', 'Në pritje': 'warn', 'Planifikuar': 'warn', 'E hapur': 'warn', 'Pa deklaruar': 'bad', 'Refuzuar': 'bad', 'Pasiv': 'bad', 'E lartë': 'bad' };
  function badge(v) { return v ? '<span class="badge ' + (BADGE[v] || '') + '">' + esc(v) + '</span>' : ''; }
  function dateCell(v, open) { if (!v) return ''; return open && v < TODAY ? '<span class="late">' + fd(v) + '</span>' : fd(v); }

  function openPdf(v) {
    if (!v) return;
    if (v.indexOf('data:') === 0) {
      var b = atob(v.split(',')[1]), a = new Uint8Array(b.length);
      for (var i = 0; i < b.length; i++) a[i] = b.charCodeAt(i);
      window.open(URL.createObjectURL(new Blob([a], { type: 'application/pdf' })), '_blank');
    } else window.open(v, '_blank');
  }

  /* ---------- skemat ---------- */
  var ST_APP = ['Në pritje', 'Në process', 'Përfunduar', 'Refuzuar'];
  var ENT = {
    clients: {
      name: 'Klientët', add: 'Klient i ri', sort: function (a, b) { return (a.emri || '').localeCompare(b.emri || ''); },
      fields: [
        { k: 'emri', l: 'Emri / Emërtimi', t: 'text', req: 1, list: 1 },
        { k: 'nipt', l: 'NIPT', t: 'text', list: 1 },
        { k: 'lloji', l: 'Lloji', t: 'select', opts: ['SH.P.K.', 'Person fizik', 'SH.A.', 'Shoqëri kolektive', 'Tjetër'], list: 1 },
        { k: 'tvshPagues', l: 'Paguan TVSH', t: 'select', opts: ['Po', 'Jo'], list: 1 },
        { k: 'statusi', l: 'Statusi', t: 'select', opts: ['Aktiv', 'Pasiv'], list: 1, badge: 1 },
        { k: 'personKontakti', l: 'Personi i kontaktit', t: 'text', list: 1 },
        { k: 'telefoni', l: 'Telefoni', t: 'tel', list: 1 },
        { k: 'email', l: 'Email', t: 'email' },
        { k: 'adresa', l: 'Adresa', t: 'text', full: 1 },
        { k: 'tarifa', l: 'Tarifa mujore (Lekë)', t: 'number' },
        { k: 'kontrataData', l: 'Data e kontratës', t: 'date' },
        { k: 'kontrataPdf', l: 'Kontrata (PDF)', t: 'pdf' },
        { k: 'certifikataSkadon', l: 'Certifikata elektronike skadon më', t: 'date' },
        { sec: 'Qasjet në platforma' },
        { k: 'userEAlbania', l: 'e-Albania – përdoruesi', t: 'text' },
        { k: 'passwordEAlbania', l: 'e-Albania – fjalëkalimi', t: 'secret', admin: 1 },
        { k: 'userEFiling', l: 'e-Filing – përdoruesi', t: 'text' },
        { k: 'passwordEFiling', l: 'e-Filing – fjalëkalimi', t: 'secret', admin: 1 },
        { k: 'userProgramiFiskal', l: 'Programi fiskal – përdoruesi', t: 'text' },
        { k: 'passwordProgramiFiskal', l: 'Programi fiskal – fjalëkalimi', t: 'secret', admin: 1 },
        { k: 'passwordCertifikata', l: 'Certifikata – fjalëkalimi', t: 'secret', admin: 1 },
        { k: 'shenime', l: 'Shënime', t: 'textarea', full: 1 }
      ]
    },
    apps: {
      name: 'Aplikimet', add: 'Aplikim i ri', sort: function (a, b) { return (b.dataAplikimit || '').localeCompare(a.dataAplikimit || ''); },
      fields: [
        { k: 'klientId', l: 'Klienti', t: 'client', req: 1, list: 1 },
        { k: 'lloji', l: 'Lloji i aplikimit', t: 'select', opts: ['NIPT i ri', 'Ndryshim në QKB', 'Licencë / Leje', 'Aplikim në e-Albania', 'Certifikatë elektronike', 'Tjetër'], list: 1 },
        { k: 'dataAplikimit', l: 'Data e aplikimit', t: 'date', list: 1, def: 'today' },
        { k: 'afati', l: 'Afati', t: 'date', list: 1, open: 1 },
        { k: 'statusi', l: 'Statusi', t: 'select', opts: ST_APP, list: 1, badge: 1 },
        { k: 'pergjegjesi', l: 'Përgjegjësi', t: 'user', list: 1 },
        { k: 'pershkrimi', l: 'Përshkrimi', t: 'textarea', full: 1 },
        { k: 'pdf', l: 'Dokument (PDF)', t: 'pdf', list: 1 }
      ]
    },
    changes: {
      name: 'Ndryshimet', add: 'Ndryshim i ri', sort: function (a, b) { return (b.data || '').localeCompare(a.data || ''); },
      fields: [
        { k: 'klientId', l: 'Klienti', t: 'client', req: 1, list: 1 },
        { k: 'lloji', l: 'Lloji i ndryshimit', t: 'select', opts: ['Adresa', 'Administratori', 'Ortakët / Kapitali', 'Objekti i veprimtarisë', 'Emërtimi', 'Tjetër'], list: 1 },
        { k: 'pershkrimi', l: 'Përshkrimi', t: 'textarea', req: 1, full: 1, list: 1 },
        { k: 'data', l: 'Data', t: 'date', list: 1, def: 'today' },
        { k: 'statusi', l: 'Statusi', t: 'select', opts: ['Planifikuar', 'Në process', 'Përfunduar'], list: 1, badge: 1 },
        { k: 'pergjegjesi', l: 'Përgjegjësi', t: 'user', list: 1 },
        { k: 'pdf', l: 'Dokument (PDF)', t: 'pdf', list: 1 }
      ]
    },
    vat: {
      name: 'Deklarimet TVSH', add: 'Deklarim i ri', sort: function (a, b) { return (b.periudha || '').localeCompare(a.periudha || '') || cn(a.klientId).localeCompare(cn(b.klientId)); },
      fields: [
        { k: 'klientId', l: 'Klienti', t: 'client', req: 1, list: 1 },
        { k: 'periudha', l: 'Periudha', t: 'month', req: 1, list: 1, def: 'month' },
        { k: 'tvshShitje', l: 'TVSH e shitjeve (Lekë)', t: 'number', list: 1 },
        { k: 'tvshBlerje', l: 'TVSH e blerjeve (Lekë)', t: 'number', list: 1 },
        { k: 'statusi', l: 'Statusi', t: 'select', opts: ['Pa deklaruar', 'Deklaruar', 'Paguar'], list: 1, badge: 1 },
        { k: 'dataDeklarimit', l: 'Data e deklarimit', t: 'date', list: 1 },
        { k: 'pdf', l: 'Deklarata (PDF)', t: 'pdf', list: 1 },
        { k: 'shenime', l: 'Shënime', t: 'textarea', full: 1 }
      ],
      extra: [
        { l: 'Diferenca', f: function (r) { var d = vatDiff(r); return '<span title="' + (d >= 0 ? 'Për t\'u paguar' : 'Kredi') + '">' + money(d) + '</span>'; }, csv: function (r) { return money(vatDiff(r)); } },
        { l: 'Afati (14 i muajit pasues)', f: function (r) { return dateCell(vatDue(r.periudha), r.statusi === 'Pa deklaruar'); }, csv: function (r) { return fd(vatDue(r.periudha)); } }
      ]
    },
    tasks: {
      name: 'Detyrat', add: 'Detyrë e re', sort: function (a, b) {
        var da = a.statusi === 'E kryer', db = b.statusi === 'E kryer';
        if (da !== db) return da ? 1 : -1;
        return (a.afati || '9999').localeCompare(b.afati || '9999');
      },
      fields: [
        { k: 'titulli', l: 'Titulli', t: 'text', req: 1, full: 1, list: 1 },
        { k: 'klientId', l: 'Klienti (opsional)', t: 'client', list: 1 },
        { k: 'afati', l: 'Afati', t: 'date', list: 1, open: 1 },
        { k: 'prioriteti', l: 'Prioriteti', t: 'select', opts: ['Normale', 'E lartë', 'E ulët'], list: 1, badge: 1 },
        { k: 'statusi', l: 'Statusi', t: 'select', opts: ['E hapur', 'Në punë', 'E kryer'], list: 1, badge: 1 },
        { k: 'pergjegjesi', l: 'Përgjegjësi', t: 'user', list: 1 },
        { k: 'pershkrimi', l: 'Përshkrimi', t: 'textarea', full: 1 }
      ]
    }
  };
  var TABS = [['dash', 'Paneli'], ['clients', 'Klientët'], ['apps', 'Aplikimet'], ['changes', 'Ndryshimet'], ['vat', 'TVSH'], ['tasks', 'Detyrat']];
  var view = 'dash', F = { q: '', st: '', per: '' };

  /* ---------- tabelat ---------- */
  function cell(ent, f, r) {
    var v = r[f.k];
    if (f.k === 'emri' && ent === 'clients') return '<a href="#" data-act="detail" data-id="' + esc(r.id) + '">' + esc(v) + '</a>';
    if (f.t === 'client') return esc(cn(v));
    if (f.t === 'date') return dateCell(v, f.open && !isDone(r));
    if (f.t === 'month') return esc(fm(v));
    if (f.t === 'number') return esc(money(v));
    if (f.t === 'pdf') return v ? '<a href="#" data-act="pdf" data-ent="' + ent + '" data-id="' + esc(r.id) + '" data-k="' + f.k + '">PDF</a>' : '';
    if (f.badge) return badge(v);
    return esc(v);
  }
  function isDone(r) { return ['Përfunduar', 'E kryer', 'Refuzuar', 'Paguar', 'Deklaruar'].indexOf(r.statusi) >= 0; }
  function listFields(ent) { return ENT[ent].fields.filter(function (f) { return f.list; }); }
  function rows(ent) {
    var q = F.q.trim().toLowerCase();
    return S[ent].filter(function (r) {
      if (F.st && r.statusi !== F.st) return false;
      if (ent === 'vat' && F.per && r.periudha !== F.per) return false;
      if (!q) return true;
      var txt = Object.keys(r).filter(function (k) { return !/^password|pdf$|Pdf$/i.test(k); }).map(function (k) { return r[k]; }).join(' ') + ' ' + cn(r.klientId);
      return txt.toLowerCase().indexOf(q) >= 0;
    }).sort(ENT[ent].sort);
  }
  function drawTable() {
    var ent = view, E = ENT[ent], lf = listFields(ent), extra = E.extra || [], rs = rows(ent);
    var h = '<table><thead><tr>' + lf.map(function (f) { return '<th>' + esc(f.l) + '</th>'; }).join('') + extra.map(function (e) { return '<th>' + esc(e.l) + '</th>'; }).join('') + '<th></th></tr></thead><tbody>';
    if (!rs.length) h += '<tr><td class="empty" colspan="' + (lf.length + extra.length + 1) + '">Nuk ka të dhëna.</td></tr>';
    rs.forEach(function (r) {
      h += '<tr>' + lf.map(function (f) { return '<td>' + cell(ent, f, r) + '</td>'; }).join('') + extra.map(function (e) { return '<td>' + e.f(r) + '</td>'; }).join('') +
        '<td class="act"><button class="btn btn-secondary btn-small" data-act="edit" data-ent="' + ent + '" data-id="' + esc(r.id) + '">Ndrysho</button> ' +
        (ent !== 'clients' || ADMIN ? '<button class="btn btn-danger btn-small" data-act="del" data-ent="' + ent + '" data-id="' + esc(r.id) + '">Fshi</button>' : '') + '</td></tr>';
    });
    $('tbl').innerHTML = h + '</tbody></table>';
    $('cnt').textContent = rs.length + ' nga ' + S[ent].length;
  }
  function renderList() {
    var ent = view, E = ENT[ent], sf = E.fields.filter(function (f) { return f.k === 'statusi'; })[0];
    var h = '<div class="toolbar"><h2>' + E.name + '</h2><input id="q" type="search" placeholder="Kërko…" value="' + esc(F.q) + '">';
    if (sf) h += '<select id="st"><option value="">Të gjitha statuset</option>' + sf.opts.map(function (o) { return '<option' + (o === F.st ? ' selected' : '') + '>' + esc(o) + '</option>'; }).join('') + '</select>';
    if (ent === 'vat') {
      var per = {}; S.vat.forEach(function (r) { if (r.periudha) per[r.periudha] = 1; });
      h += '<select id="per"><option value="">Të gjitha periudhat</option>' + Object.keys(per).sort().reverse().map(function (p) { return '<option value="' + p + '"' + (p === F.per ? ' selected' : '') + '>' + esc(fm(p)) + '</option>'; }).join('') + '</select>' +
        '<button class="btn btn-secondary" data-act="genvat">Gjenero për klientët me TVSH</button>';
    }
    h += '<span id="cnt" style="color:#6b7280"></span><span style="flex:1"></span><button class="btn btn-secondary" data-act="csv">Eksporto CSV</button><button class="btn btn-primary" data-act="add" data-ent="' + ent + '">+ ' + E.add + '</button></div><div class="table-section" id="tbl"></div>';
    $('main').innerHTML = h; drawTable();
  }

  /* ---------- paneli ---------- */
  function renderDash() {
    var openApps = S.apps.filter(function (r) { return r.statusi === 'Në pritje' || r.statusi === 'Në process'; });
    var openTasks = S.tasks.filter(function (r) { return r.statusi !== 'E kryer'; });
    var vatPend = S.vat.filter(function (r) { return r.statusi === 'Pa deklaruar'; });
    var active = S.clients.filter(function (c) { return c.statusi !== 'Pasiv'; });
    var late = vatPend.filter(function (r) { return vatDue(r.periudha) < TODAY; }).length;
    function card(n, t, v) { return '<div class="card" data-act="go" data-v="' + v + '"><b>' + n + '</b><span>' + t + '</span></div>'; }
    function by(f) { return function (a, b) { return (a[f] || '9999').localeCompare(b[f] || '9999'); }; }
    function panel(title, items) {
      return '<div class="panel"><h3>' + title + '</h3>' + (items.length ? items.slice(0, 8).map(function (i) { return '<div class="it" data-act="edit" data-ent="' + i.ent + '" data-id="' + esc(i.id) + '"><span>' + i.t + '</span><span>' + i.d + '</span></div>'; }).join('') : '<div class="none">Asgjë për momentin.</div>') + '</div>';
    }
    var tItems = openTasks.sort(by('afati')).map(function (r) { return { ent: 'tasks', id: r.id, t: esc(r.titulli) + (r.klientId ? ' <span style="color:#6b7280">· ' + esc(cn(r.klientId)) + '</span>' : ''), d: dateCell(r.afati, 1) }; });
    var vItems = vatPend.filter(function (r) { return vatDue(r.periudha) <= addDays(10); }).sort(function (a, b) { return vatDue(a.periudha).localeCompare(vatDue(b.periudha)); })
      .map(function (r) { return { ent: 'vat', id: r.id, t: esc(cn(r.klientId)) + ' <span style="color:#6b7280">· ' + esc(fm(r.periudha)) + '</span>', d: dateCell(vatDue(r.periudha), 1) }; });
    var aItems = openApps.sort(by('afati')).map(function (r) { return { ent: 'apps', id: r.id, t: esc(cn(r.klientId)) + ' <span style="color:#6b7280">· ' + esc(r.lloji) + '</span>', d: dateCell(r.afati, 1) }; });
    var cItems = active.filter(function (c) { return c.certifikataSkadon && c.certifikataSkadon <= addDays(60); }).sort(by('certifikataSkadon'))
      .map(function (c) { return { ent: 'clients', id: c.id, t: esc(c.emri), d: dateCell(c.certifikataSkadon, 1) }; });
    $('main').innerHTML = '<div class="toolbar"><h2>Paneli</h2><span style="color:#6b7280">Sot: ' + fd(TODAY) + '</span></div><div class="cards">' +
      card(active.length, 'Klientë aktivë', 'clients') + card(openApps.length, 'Aplikime të hapura', 'apps') + card(openTasks.length, 'Detyra të hapura', 'tasks') + card(vatPend.length + (late ? ' (' + late + ' me vonesë)' : ''), 'TVSH pa deklaruar', 'vat') + '</div>' +
      '<div class="panels">' + panel('Detyrat e hapura', tItems) + panel('TVSH me afat brenda 10 ditëve ose me vonesë', vItems) + panel('Aplikime në proces', aItems) + panel('Certifikata që skadojnë (60 ditë)', cItems) + '</div>';
  }

  function render() {
    $('tabs').innerHTML = TABS.map(function (t) { return '<button data-act="go" data-v="' + t[0] + '" class="' + (t[0] === view ? 'on' : '') + '">' + t[1] + '</button>'; }).join('') +
      '<span class="sp"></span><button data-act="backup">Kopje rezervë (JSON)</button>';
    if (view === 'dash') renderDash(); else renderList();
  }

  /* ---------- formulari ---------- */
  var FM = null;
  function optList(arr, cur, blank) { return (blank ? '<option value=""></option>' : '') + arr.map(function (o) { return '<option' + (o === cur ? ' selected' : '') + '>' + esc(o) + '</option>'; }).join(''); }
  function fieldHtml(f, v) {
    if (f.sec) return '<h4>' + esc(f.sec) + '</h4>' + (!ADMIN ? '<div class="note">Fjalëkalimet e klientëve shihen dhe ndryshohen vetëm nga administratori.</div>' : '');
    var id = 'f_' + f.k, h = '<div class="form-group' + (f.full ? ' full' : '') + '"><label for="' + id + '">' + esc(f.l) + (f.req ? ' *' : '') + '</label>';
    if (f.t === 'textarea') h += '<textarea id="' + id + '" rows="3">' + esc(v) + '</textarea>';
    else if (f.t === 'select') h += '<select id="' + id + '">' + optList(f.opts, v) + '</select>';
    else if (f.t === 'user') h += '<select id="' + id + '">' + optList(users(), v, 1) + '</select>';
    else if (f.t === 'client') {
      var cs = S.clients.filter(function (c) { return c.statusi !== 'Pasiv' || c.id === v; }).sort(ENT.clients.sort);
      h += '<select id="' + id + '"><option value=""></option>' + cs.map(function (c) { return '<option value="' + esc(c.id) + '"' + (c.id === v ? ' selected' : '') + '>' + esc(c.emri) + '</option>'; }).join('') + '</select>';
    } else if (f.t === 'pdf') h += '<div id="pdf_' + f.k + '"></div>';
    else if (f.t === 'secret') h += '<div class="pw"><input id="' + id + '" type="password" autocomplete="new-password" value="' + esc(v) + '"><button type="button" class="btn btn-secondary btn-small" data-act="showpw" data-for="' + id + '">Shfaq</button></div>';
    else h += '<input id="' + id + '" type="' + f.t + '"' + (f.t === 'number' ? ' step="any"' : '') + ' value="' + esc(v) + '">';
    return h + '</div>';
  }
  function drawPdf(k) {
    var v = FM.rec[k], box = $('pdf_' + k);
    if (!box) return;
    box.innerHTML = (v ? '<a href="#" data-act="fpdf" data-k="' + k + '">Shiko PDF-në aktuale</a> · <a href="#" data-act="fpdfdel" data-k="' + k + '">Hiq</a><br>' : '') +
      '<input type="file" accept="application/pdf" data-pdfk="' + k + '" style="margin-top:6px"><div style="color:#6b7280;font-size:.85em;margin-top:2px">Vetëm PDF, maksimumi rreth 3 MB.</div>';
  }
  function openForm(ent, id, preset) {
    var E = ENT[ent], rec = id ? JSON.parse(JSON.stringify(find(ent, id))) : { id: uid() };
    if (!id) E.fields.forEach(function (f) {
      if (f.k) rec[f.k] = f.def === 'today' ? TODAY : f.def === 'month' ? TODAY.slice(0, 7) : (f.opts ? f.opts[0] : '');
      if (f.k === 'pergjegjesi') rec[f.k] = ME.name;
    });
    if (!id && preset) Object.keys(preset).forEach(function (k) { rec[k] = preset[k]; });
    FM = { ent: ent, rec: rec, isNew: !id };
    $('fmT').textContent = id ? 'Ndrysho' : E.add;
    $('fmB').innerHTML = E.fields.filter(function (f) { return ADMIN || !f.admin; }).map(function (f) { return fieldHtml(f, f.k ? rec[f.k] : null); }).join('');
    E.fields.forEach(function (f) { if (f.t === 'pdf') drawPdf(f.k); });
    $('fm').classList.add('active');
    var first = $('fmB').querySelector('input,select,textarea'); if (first) first.focus();
  }
  function closeForm() { $('fm').classList.remove('active'); FM = null; }
  function submitForm(ev) {
    ev.preventDefault();
    if (!FM) return;
    var E = ENT[FM.ent], rec = FM.rec;
    for (var i = 0; i < E.fields.length; i++) {
      var f = E.fields[i];
      if (!f.k || f.t === 'pdf' || (f.admin && !ADMIN)) continue;
      var el = $('f_' + f.k), v = el.value.trim();
      if (f.req && !v) { alert('Plotëso fushën: ' + f.l); el.focus(); return; }
      rec[f.k] = v;
    }
    if (FM.ent === 'clients' && rec.nipt && !/^[A-Za-z]\d{8}[A-Za-z]$/.test(rec.nipt) && !confirm('NIPT-i nuk ka formatin e zakonshëm (p.sh. L12345678A). Të ruhet njëlloj?')) return;
    if (FM.ent === 'clients' && rec.nipt && S.clients.some(function (c) { return c.id !== rec.id && (c.nipt || '').toLowerCase() === rec.nipt.toLowerCase(); }) && !confirm('Ekziston një klient tjetër me këtë NIPT. Të ruhet njëlloj?')) return;
    var arr = S[FM.ent], idx = -1;
    arr.forEach(function (r, n) { if (r.id === rec.id) idx = n; });
    if (!ADMIN && FM.ent === 'clients' && idx >= 0) ['passwordEAlbania', 'passwordEFiling', 'passwordProgramiFiskal', 'passwordCertifikata'].forEach(function (k) { rec[k] = arr[idx][k] || ''; });
    if (idx >= 0) arr[idx] = rec; else arr.push(rec);
    save(FM.ent); closeForm(); render();
  }

  /* ---------- detaji i klientit ---------- */
  function openDetail(id) {
    var c = clientById(id); if (!c) return;
    var kv = [['NIPT', c.nipt], ['Lloji', c.lloji], ['Paguan TVSH', c.tvshPagues], ['Statusi', c.statusi], ['Personi i kontaktit', c.personKontakti], ['Telefoni', c.telefoni], ['Email', c.email ? '<a href="mailto:' + esc(c.email) + '">' + esc(c.email) + '</a>' : ''],
      ['Adresa', c.adresa], ['Tarifa mujore', c.tarifa ? money(c.tarifa) + ' Lekë' : ''], ['Kontrata', fd(c.kontrataData)], ['Certifikata skadon', fd(c.certifikataSkadon)], ['e-Albania', c.userEAlbania], ['e-Filing', c.userEFiling], ['Programi fiskal', c.userProgramiFiskal], ['Shënime', c.shenime]];
    var raw = { Email: 1 };
    var h = '<dl class="kv">' + kv.filter(function (r) { return r[1]; }).map(function (r) { return '<dt>' + r[0] + '</dt><dd>' + (raw[r[0]] ? r[1] : esc(r[1])) + '</dd>'; }).join('') + '</dl>';
    if (c.kontrataPdf) h += '<p><a href="#" data-act="pdf" data-ent="clients" data-id="' + esc(c.id) + '" data-k="kontrataPdf">Hap kontratën (PDF)</a></p>';
    [['apps', 'Aplikime', 'lloji', 'dataAplikimit'], ['changes', 'Ndryshime', 'lloji', 'data'], ['vat', 'TVSH', 'periudha', 'periudha'], ['tasks', 'Detyra', 'titulli', 'afati']].forEach(function (g) {
      var rs = S[g[0]].filter(function (r) { return r.klientId === id; }).sort(ENT[g[0]].sort);
      h += '<div class="sub"><span>' + g[1] + ' (' + rs.length + ')</span><button class="btn btn-secondary btn-small" data-act="addfor" data-ent="' + g[0] + '" data-id="' + esc(id) + '">+ Shto</button></div>';
      if (rs.length) h += '<div class="table-section"><table style="min-width:0"><tbody>' + rs.slice(0, 10).map(function (r) {
        return '<tr style="cursor:pointer" data-act="edit" data-ent="' + g[0] + '" data-id="' + esc(r.id) + '"><td>' + esc(g[2] === 'periudha' ? fm(r[g[2]]) : r[g[2]]) + '</td><td>' + fd(r[g[3]] && g[3] !== 'periudha' ? r[g[3]] : '') + '</td><td>' + badge(r.statusi) + '</td></tr>';
      }).join('') + '</tbody></table></div>';
    });
    h += '<div class="foot"><button class="btn btn-secondary" data-act="edit" data-ent="clients" data-id="' + esc(id) + '">Ndrysho klientin</button></div>';
    $('dmT').textContent = c.emri; $('dmB').innerHTML = h; $('dm').classList.add('active');
  }

  /* ---------- eksport ---------- */
  function download(name, mime, text) {
    var a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], { type: mime })); a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
  }
  function csvExport() {
    var ent = view, lf = listFields(ent).filter(function (f) { return f.t !== 'pdf'; }), extra = ENT[ent].extra || [];
    function q(s) { s = String(s == null ? '' : s); return '"' + s.replace(/"/g, '""') + '"'; }
    var out = [lf.map(function (f) { return q(f.l); }).concat(extra.map(function (e) { return q(e.l); })).join(';')];
    rows(ent).forEach(function (r) {
      out.push(lf.map(function (f) { var v = r[f.k]; return q(f.t === 'client' ? cn(v) : f.t === 'date' ? fd(v) : f.t === 'month' ? fm(v) : v); }).concat(extra.map(function (e) { return q(e.csv ? e.csv(r) : ''); })).join(';'));
    });
    download(ent + '-' + TODAY + '.csv', 'text/csv;charset=utf-8', '﻿' + out.join('\r\n'));
  }
  function backup() {
    var x = JSON.parse(JSON.stringify(S.x)); delete x.users;
    download('crm-kopje-rezervë-' + TODAY + '.json', 'application/json', JSON.stringify({ data: TODAY, klientet: S.clients, aplikimet: S.apps, ndryshimet: S.changes, tvsh: S.vat, tjera: x }, null, 1));
  }
  function genVat() {
    var per = prompt('Për cilën periudhë (VVVV-MM)?', TODAY.slice(0, 7));
    if (!per) return;
    if (!/^\d{4}-(0[1-9]|1[0-2])$/.test(per)) { alert('Formati i periudhës duhet të jetë VVVV-MM, p.sh. ' + TODAY.slice(0, 7)); return; }
    var n = 0;
    S.clients.forEach(function (c) {
      if (c.statusi === 'Pasiv' || c.tvshPagues !== 'Po') return;
      if (S.vat.some(function (r) { return r.klientId === c.id && r.periudha === per; })) return;
      S.vat.push({ id: uid(), klientId: c.id, periudha: per, tvshShitje: '', tvshBlerje: '', statusi: 'Pa deklaruar', dataDeklarimit: '', shenime: '' }); n++;
    });
    if (n) save('vat'); F.per = per; render(); alert(n ? 'U krijuan ' + n + ' deklarime për ' + fm(per) + '.' : 'Të gjithë klientët me TVSH kanë tashmë deklarim për këtë periudhë.');
  }

  /* ---------- ngjarjet ---------- */
  document.addEventListener('click', function (e) {
    var t = e.target.closest('[data-act]'); if (!t) return;
    var a = t.getAttribute('data-act'), ent = t.getAttribute('data-ent'), id = t.getAttribute('data-id');
    if (t.tagName === 'A') e.preventDefault();
    if (a === 'go') { view = t.getAttribute('data-v'); F = { q: '', st: '', per: '' }; render(); }
    else if (a === 'add') openForm(ent);
    else if (a === 'edit') { $('dm').classList.remove('active'); openForm(ent, id); }
    else if (a === 'addfor') { $('dm').classList.remove('active'); openForm(ent, null, { klientId: id }); }
    else if (a === 'detail') openDetail(id);
    else if (a === 'closeForm') closeForm();
    else if (a === 'closeDetail') $('dm').classList.remove('active');
    else if (a === 'del') {
      if (ent === 'clients') {
        var n = ['apps', 'changes', 'vat', 'tasks'].reduce(function (s, k) { return s + S[k].filter(function (r) { return r.klientId === id; }).length; }, 0);
        if (n) { alert('Ky klient ka ' + n + ' të dhëna të lidhura (aplikime, ndryshime, TVSH ose detyra). Fshi ose ndrysho ato së pari, ose vendose klientin si "Pasiv".'); return; }
      }
      if (!confirm('Të fshihet ky rresht?')) return;
      S[ent] = S[ent].filter(function (r) { return r.id !== id; });
      if (ent === 'tasks') { S.x.detyra = S.tasks = S[ent]; }
      save(ent); render();
    }
    else if (a === 'pdf') { var r = find(ent, id); if (r) openPdf(r[t.getAttribute('data-k')]); }
    else if (a === 'fpdf') openPdf(FM.rec[t.getAttribute('data-k')]);
    else if (a === 'fpdfdel') { FM.rec[t.getAttribute('data-k')] = ''; drawPdf(t.getAttribute('data-k')); }
    else if (a === 'showpw') { var el = $(t.getAttribute('data-for')); el.type = el.type === 'password' ? 'text' : 'password'; t.textContent = el.type === 'password' ? 'Shfaq' : 'Fshih'; }
    else if (a === 'genvat') genVat();
    else if (a === 'csv') csvExport();
    else if (a === 'backup') backup();
  });
  document.addEventListener('input', function (e) {
    if (e.target.id === 'q') { F.q = e.target.value; drawTable(); }
  });
  document.addEventListener('change', function (e) {
    var t = e.target;
    if (t.id === 'st') { F.st = t.value; drawTable(); }
    else if (t.id === 'per') { F.per = t.value; drawTable(); }
    else if (t.hasAttribute && t.hasAttribute('data-pdfk') && FM) {
      var f = t.files[0], k = t.getAttribute('data-pdfk'); if (!f) return;
      if (f.type !== 'application/pdf' && !/\.pdf$/i.test(f.name)) { alert('Pranohen vetëm skedarë PDF.'); t.value = ''; return; }
      if (f.size > MAXPDF) { alert('PDF-ja është shumë e madhe (maksimumi rreth 3 MB).'); t.value = ''; return; }
      var rd = new FileReader();
      rd.onload = function () { if (FM) { FM.rec[k] = String(rd.result).replace(/^data:[^;]*;base64,/, 'data:application/pdf;base64,'); drawPdf(k); } };
      rd.readAsDataURL(f);
    }
  });
  $('fmF').addEventListener('submit', submitForm);
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') { closeForm(); $('dm').classList.remove('active'); } });

  render();
})();
</script>
</body>
</html>
